name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q ml tests

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test synthetic ML pipeline
        run: |
          python -m ml.generate_synthetic --rows 2000 --seed 42
          python -m ml.train_baseline
          python -m ml.predict_task --days-until-due 3 --created-weekday 0 --has-assignee 1