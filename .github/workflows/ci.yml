name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -q fastapi uvicorn httpx sqlalchemy alembic pytest openai pandas scikit-learn

      - name: Compile Python files
        run: python -m compileall -q ml tests

      - name: Run tests
        run: python -m pytest -q